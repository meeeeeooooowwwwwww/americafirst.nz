name: Deploy americafirst.nz (independent)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to release americafirst.nz from this repository"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: americafirst-nz-site-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require approved main branch and manual confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRM" = "DEPLOY"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact checked-out commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Guard own Cloudflare script and production domain
        run: |
          node -e "const c=require('./wrangler.jsonc'); if(c.name!=='americafirst-nz-site') throw Error('Wrong Worker'); if(!Array.isArray(c.routes)||c.routes.length!==1||c.routes[0].pattern!=='americafirst.nz') throw Error('Unexpected route target');"
      - name: Rebuild social share image from repository source
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/social-card-venv"
          "$RUNNER_TEMP/social-card-venv/bin/pip" install --disable-pip-version-check 'CairoSVG==2.8.2'
          "$RUNNER_TEMP/social-card-venv/bin/python" scripts/build-social-card.py
          test -s public/assets/social-share.png
      - name: Dry-run own Worker bundle
        run: npx --yes wrangler@4.131.1 deploy --dry-run
      - name: Require this repository's Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo "::error::CLOUDFLARE_API_TOKEN is not available to americafirst.nz."
            exit 1
          }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || {
            echo "::error::Configure CLOUDFLARE_ACCOUNT_ID in the americafirst.nz repository before deploying."
            exit 1
          }
      - name: Deploy americafirst.nz Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.131.1 deploy --message "americafirst.nz independent release $GITHUB_SHA"
      - name: Check own live homepage
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 https://americafirst.nz/ -o "$RUNNER_TEMP/home.html"
          grep -Fqi 'America First' "$RUNNER_TEMP/home.html"
